name: Deploy Supabase DB

on:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: hqmgnouwuastlsenalre
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD. Add them in GitHub Actions secrets, then rerun this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push
