name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: hqmgnouwuastlsenalre
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Missing SUPABASE_ACCESS_TOKEN. Function deploys and database migrations will be skipped."
            echo "has_access_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_access_token=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Missing SUPABASE_DB_PASSWORD. Database migrations will be skipped."
            echo "has_db_password=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_db_password=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.has_access_token == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.secrets.outputs.has_access_token == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        if: steps.secrets.outputs.has_access_token == 'true' && steps.secrets.outputs.has_db_password == 'true'
        run: supabase db push

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.has_access_token == 'true'
        run: supabase functions deploy
